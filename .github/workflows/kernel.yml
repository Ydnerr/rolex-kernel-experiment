name: Build Kernel Rolex
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nick89786/android_kernel_xiaomi_msm8917
          path: kernel
          depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex \
            libssl-dev libelf-dev zip git

      - name: Clone toolchain (GCC 4.9)
        run: |
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            $HOME/gcc

      - name: Build
        working-directory: kernel
        run: |
          # fix dtc error di host GCC baru
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          export ARCH=arm
          export CROSS_COMPILE=$HOME/gcc/bin/arm-linux-androideabi-
          make O=out rolex_defconfig
          make -j$(nproc) O=out 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm/boot/zImage-dtb ak3/
          cd ak3 && zip -r9 ../Kernel-rolex.zip * -x .git README.md

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-rolex
          path: |
            Kernel-rolex.zip
            kernel/build.log
