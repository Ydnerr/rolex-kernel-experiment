name: Build Kernel Rolex OC
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch (kosongkan = default)"
        default: ""
      gpu650:
        description: "OC GPU ke 650 MHz (matikan kalau GPU bermasalah)"
        type: boolean
        default: true
      cpu_khz:
        description: "Frekuensi maksimum CPU (kHz)"
        type: choice
        options:
          - "1536000"
          - "1497600"
        default: "1536000"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nick89786/android_kernel_xiaomi_msm8917
          ref: ${{ inputs.branch }}
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex \
            libssl-dev libelf-dev zip git

      - name: Clone toolchain (GCC 4.9 aarch64)
        run: |
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            $HOME/gcc64

      - name: Patch OC CPU (speed bin 0)
        working-directory: kernel
        shell: bash
        env:
          CPU_KHZ: ${{ inputs.cpu_khz }}
        run: |
          python3 - << 'EOF'
          import os, re
          khz = os.environ['CPU_KHZ']
          hz = khz + '000'
          D = 'arch/arm/boot/dts/qcom/'

          p = D + 'msm8917.dtsi'
          s = open(p).read()
          # ganti frekuensi step ke-5 di tabel bin 1 dan di cpufreq-table
          s, n = re.subn(r'<\s*1497600000\s+5>', '< %s 5>' % hz, s)
          assert n == 1, 'entri corner 5 bin 1 tidak ketemu'
          s, n = re.subn(r'<\s*1497600\s*>', '< %s >' % khz, s)
          assert n == 1, 'cpufreq-table tidak ketemu'
          # tambah corner 5 ke tabel speed bin 0
          m = re.search(r'qcom,speed0-bin-v0-c1\s*=[^;]*?<\s*1401000000\s+4>', s)
          assert m, 'blok speed0-bin-v0-c1 tidak ketemu'
          s = s[:m.end()] + ',\n\t\t\t< %s 5>' % hz + s[m.end():]
          open(p, 'w').write(s)

          p = D + 'msm8917-regulator.dtsi'
          s = open(p).read()
          # peta corner CPR: corner 5 ikut frekuensi baru
          s, n = re.subn(r'<5 1497600000>', '<5 %s>' % hz, s)
          assert n == 1, 'corner-frequency-map corner 5 tidak ketemu'
          # izinkan bin 0 sampai corner 5
          assert s.count('<0 (-1) 1 2 4>') == 1, 'speed-bin-max-corners bin 0 tidak ketemu'
          s = s.replace('<0 (-1) 1 2 4>', '<0 (-1) 1 2 5>')
          open(p, 'w').write(s)
          EOF

          echo "=== hasil patch CPU: ${CPU_KHZ} kHz ==="
          grep -n "${CPU_KHZ}000 5>" arch/arm/boot/dts/qcom/msm8917.dtsi
          grep -n "< ${CPU_KHZ} >" arch/arm/boot/dts/qcom/msm8917.dtsi
          grep -n "<5 ${CPU_KHZ}000>" arch/arm/boot/dts/qcom/msm8917-regulator.dtsi
          grep -n "<0 (-1) 1 2 5>" arch/arm/boot/dts/qcom/msm8917-regulator.dtsi
          test "$(grep -c "${CPU_KHZ}000 5>" arch/arm/boot/dts/qcom/msm8917.dtsi)" -ge 2

      - name: Patch OC GPU (650 MHz untuk speed bin 0)
        if: ${{ inputs.gpu650 }}
        working-directory: kernel
        shell: bash
        run: |
          python3 - << 'EOF'
          # 1) clock: pakai tabel gfx3d 650 MHz untuk semua speed bin
          p = 'drivers/clk/msm/clock-gcc-8952.c'
          s = open(p).read()
          a = s.index('static void override_for_8917(int speed_bin)')
          b = s.index('static void override_for_8937(int speed_bin)')
          f = s[a:b]
          assert f.count('if (speed_bin) {') == 1, 'cabang speed_bin gfx3d tidak ketemu'
          f = f.replace('if (speed_bin) {', 'if (1) {')
          s = s[:a] + f + s[b:]
          open(p, 'w').write(s)

          # 2) dts: pwrlevel@0 bin 0 disalin dari bin 1 (650 MHz)
          p = 'arch/arm/boot/dts/qcom/msm8917.dtsi'
          s = open(p).read()
          i0 = s.index('qcom,gpu-pwrlevels-0 {')
          i1 = s.index('qcom,gpu-pwrlevels-1 {')
          def block(s, start):
              a = s.index('qcom,gpu-pwrlevel@0 {', start)
              b = s.index('};', a) + 2
              return a, b
          a1, b1 = block(s, i1)
          blk1 = s[a1:b1]
          assert '650000000' in blk1, 'pwrlevel@0 bin 1 bukan 650 MHz'
          a0, b0 = block(s, i0)
          assert '598000000' in s[a0:b0], 'pwrlevel@0 bin 0 bukan 598 MHz'
          s = s[:a0] + blk1 + s[b0:]
          open(p, 'w').write(s)
          EOF

          echo "=== hasil patch GPU ==="
          grep -n "if (1) {" drivers/clk/msm/clock-gcc-8952.c
          grep -n "qcom,gpu-freq = <650000000>" arch/arm/boot/dts/qcom/msm8917.dtsi
          test "$(grep -c 'qcom,gpu-freq = <650000000>' arch/arm/boot/dts/qcom/msm8917.dtsi)" -ge 2

      - name: Build
        working-directory: kernel
        shell: bash
        run: |
          # fix dtc error di host GCC baru
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$HOME/gcc64/bin/aarch64-linux-android-
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github
          # nama kernel + zram (lz4) + swap lewat salinan defconfig
          cp arch/arm64/configs/rolex_defconfig arch/arm64/configs/xvft_defconfig
          cat >> arch/arm64/configs/xvft_defconfig << 'EOF'
          CONFIG_LOCALVERSION="-xvft-oc"
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_SWAP=y
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_LZ4_COMPRESS=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          EOF
          make O=out xvft_defconfig

          # jalankan sinkronisasi config sekali di sini supaya pesan error (kalau ada) kelihatan jelas
          make O=out silentoldconfig 2>&1 | tail -40

          # cek config mana yang beneran aktif
          grep -E "^CONFIG_(LOCALVERSION|SWAP|ZSMALLOC|ZRAM|ZRAM_LZ4_COMPRESS|CRYPTO_LZ4|ANDROID_LOW_MEMORY_KILLER|MSM_KGSL|CC_OPTIMIZE_FOR_SIZE)[= ]" out/.config | tee ../config-check.txt
          grep -E "KGSL|ADRENO|DEVFREQ" out/.config | grep "=y" >> ../config-check.txt || true

          make -j$(nproc) O=out 2>&1 | tee ../build.log
          ls -la out/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/

          # anykernel.sh ditulis ulang total (tanpa sed), huruf besar dan kecil
          # sama-sama diisi supaya cocok dengan versi AnyKernel3 apa pun
          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 - xvft-oc (Redmi 4A / rolex)

          properties() { '
          kernel.string=xvft-oc
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=rolex
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          echo "=== anykernel.sh final ==="
          cat ak3/anykernel.sh
          grep -q "BLOCK=/dev/block/bootdevice/by-name/boot" ak3/anykernel.sh

          cd ak3
          zip -r9 ../xvft-oc-rolex.zip * -x .git README.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xvft-oc-rolex
          path: |
            xvft-oc-rolex.zip
            build.log
            config-check.txt
