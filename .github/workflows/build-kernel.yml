name: Build Kernel Rolex
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch (kosongkan = default)"
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nick89786/android_kernel_xiaomi_msm8917
          ref: ${{ inputs.branch }}
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex \
            libssl-dev libelf-dev zip git ccache

      - name: Clone toolchain (GCC 4.9 aarch64)
        run: |
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            $HOME/gcc64

      - name: Build
        working-directory: kernel
        run: |
          # fix dtc error di host GCC baru
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$HOME/gcc64/bin/aarch64-linux-android-
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github
          make O=out rolex_defconfig

          # nama kernel + zram (lz4) + swap
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-xvft-experimental" \
            --disable LOCALVERSION_AUTO \
            --enable SWAP --enable ZSMALLOC --enable ZRAM \
            --enable ZRAM_LZ4_COMPRESS --enable CRYPTO_LZ4 \
            --enable LZ4_COMPRESS --enable LZ4_DECOMPRESS
          make O=out olddefconfig

          # cek config mana yang beneran aktif
          grep -E "^CONFIG_(LOCALVERSION|SWAP|ZSMALLOC|ZRAM|ZRAM_LZ4_COMPRESS|CRYPTO_LZ4|ANDROID_LOW_MEMORY_KILLER|MSM_KGSL|CC_OPTIMIZE_FOR_SIZE)[= ]" out/.config | tee ../config-check.txt
          grep -E "KGSL|ADRENO|DEVFREQ" out/.config | grep "=y" >> ../config-check.txt || true

          make -j$(nproc) O=out 2>&1 | tee ../build.log
          ls -la out/arch/arm64/boot/

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          sed -i 's/^device.name1=.*/device.name1=rolex/' anykernel.sh
          sed -i 's/^device.name\([2-5]\)=.*/device.name\1=/' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=0;/' anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=xvft-experimental/' anykernel.sh
          zip -r9 ../xvft-experimental-rolex.zip * -x .git README.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xvft-experimental-rolex
          path: |
            xvft-experimental-rolex.zip
            build.log
            config-check.txt
