name: MSM8917 Deep Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel
        run: |
          git clone --depth=1 \
            https://github.com/Mi-Thorium/kernel_msm-4.19.git kernel

      - name: Inspect MSM8917
        run: |
          cd kernel

          echo "===== MI8917 CONFIG ====="
          cat arch/arm64/configs/vendor/xiaomi/msm8937/mi8917.config

          echo "===== MSM8937 CONFIG ====="
          cat arch/arm64/configs/vendor/xiaomi/msm8937/mi8937.config

          echo "===== EXCLUSION CONFIG ====="
          cat arch/arm64/configs/vendor/xiaomi/msm8937/mi8937_exclude_mi8917.config

          echo "===== MSM8917 MAKEFILE ====="
          grep -n "msm8917" arch/arm64/boot/dts/vendor/qcom/Makefile || true

          echo "===== DEVICE TREE REFERENCES ====="
          grep -Rni "msm8917" arch/arm64/boot/dts/vendor/qcom/ || true

          echo "===== MSM8917 DRIVERS ====="
          grep -Ril "msm8917" drivers/ | head -100
