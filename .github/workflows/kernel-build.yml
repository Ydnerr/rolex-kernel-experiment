name: Rolex Kernel Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex \
            build-essential libssl-dev libelf-dev \
            device-tree-compiler python3

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/Mi-Thorium/kernel_msm-4.19.git kernel

      - name: Inspect source
              - name: Inspect MSM8917 configuration
        run: |
          cd kernel

          echo "=== MI8917 CONFIG ==="
          cat arch/arm64/configs/vendor/xiaomi/msm8937/mi8917.config

          echo "=== MSM8937 CONFIG ==="
          cat arch/arm64/configs/vendor/xiaomi/msm8937/mi8937.config

          echo "=== EXCLUSION CONFIG ==="
          cat arch/arm64/configs/vendor/xiaomi/msm8937/mi8937_exclude_mi8917.config

          echo "=== DEVICE TREE MAKEFILE ==="
          grep -n "msm8917" arch/arm64/boot/dts/vendor/qcom/Makefile || true

          echo "=== MSM8917 DTSI REFERENCES ==="
          grep -Rni "msm8917" arch/arm64/boot/dts/vendor/qcom/
      
        run: |
          cd kernel
          echo "=== COMMIT ==="
          git log -1 --oneline

          echo "=== MSM8917 DTS ==="
          grep -Ril "msm8917" \
            arch/arm64/boot/dts/ || true

          echo "=== ROLEX DTS ==="
          grep -Ril "rolex" \
            arch/arm64/boot/dts/ || true

          echo "=== DEFCONFIG ==="
          find arch/arm64/configs -type f
