name: Kernel Build Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v4

      - name: Clone kernel and device tree
        run: |
          git clone --depth=1 https://github.com/Mi-Thorium/kernel_msm-4.19.git kernel
          git clone --depth=1 https://github.com/Mi-Thorium/android_device_xiaomi_Mi8937.git device

      - name: Audit kernel build integration
        shell: bash
        run: |
          set -o pipefail

          echo "===== DEVICE BOARD CONFIG 4.19 ====="
          if [ -f device/Mi8937_4_19/BoardConfig.mk ]; then
            cat device/Mi8937_4_19/BoardConfig.mk
          else
            echo "Not found: device/Mi8937_4_19/BoardConfig.mk"
          fi

          echo "===== DEVICE BOARD CONFIG FILES ====="
          find device -name "BoardConfigCommon.mk" -o -name "*kernel*.mk"

          echo "===== KERNEL BUILD VARIABLES ====="
          grep -RniE "TARGET_KERNEL_CONFIG|TARGET_KERNEL_VERSION|TARGET_USES_MITHORIUM_KERNEL" \
            device/ --include="*.mk" --include="*.bp" | head -150 || true

          echo "===== MITHORIUM COMMON REFERENCES ====="
          grep -RniE "TARGET_KERNEL_CONFIG|KERNEL_CONFIG|DEFCONFIG|make.*Image" \
            device/ --include="*.mk" --include="*.sh" | head -150 || true

          echo "===== KERNEL CONFIG FRAGMENTS ====="
          cd kernel

          echo "--- legacy ---"
          if [ -f arch/arm64/configs/vendor/msm8937-legacy.config ]; then
            cat arch/arm64/configs/vendor/msm8937-legacy.config
          else
            echo "legacy config not found"
          fi

          echo "--- common ---"
          if [ -f arch/arm64/configs/vendor/xiaomi/msm8937/common.config ]; then
            cat arch/arm64/configs/vendor/xiaomi/msm8937/common.config
          else
            echo "common config not found"
          fi

          echo "--- mi8937 ---"
          if [ -f arch/arm64/configs/vendor/xiaomi/msm8937/mi8937.config ]; then
            cat arch/arm64/configs/vendor/xiaomi/msm8937/mi8937.config
          else
            echo "mi8937 config not found"
          fi

          echo "===== ROLEX CONFIG RESULT ====="
          grep -nE "MACH_XIAOMI_ROLEX|BATTERY_CW2015_ROLEX|SMB358_CHARGER_ROLEX" \
            arch/arm64/configs/vendor/xiaomi/msm8937/*.config || true

          echo "===== KERNEL DTS FILES ====="
          find arch/arm64/boot/dts -maxdepth 3 -type f \
            \( -iname "*rolex*" -o -iname "*8917*" -o -iname "*8937*" \) -print

          echo "===== DTS AND BUILD REFERENCES ====="
          grep -RniE "rolex|msm8917|Mi8937_4_19" \
            arch/arm64/boot/dts Makefile arch/arm64/Makefile scripts \
            --include="Makefile" --include="*.dts" --include="*.dtsi" --include="*.mk" \
            --include="*.sh" 2>/dev/null | head -200 || true
